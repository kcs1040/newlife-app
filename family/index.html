<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>우리집 재정</title>
<style>
  :root {
    --bg: #EFECE4; --surface: #F9F7F2; --sunk: #E7E2D6;
    --ink: #1F1C17; --muted: #6B6456; --faint: #9B927F;
    --accent: #A8722F; --accent-soft: #E9DCC2;
    --in: #4C7A5C; --in-soft: #DEE8E0;
    --out: #B0503E; --out-soft: #F0DED9;
    --save: #3E6E82; --save-soft: #DAE5EA;
    --line: #DBD4C6; --r: 8px;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141109; --surface: #1D190F; --sunk: #100D07;
      --ink: #F2EDE2; --muted: #A69A84; --faint: #786F5D;
      --accent: #DDA05A; --accent-soft: #3A2C17;
      --in: #7EB58F; --in-soft: #22322A;
      --out: #DE8873; --out-soft: #3A241F;
      --save: #7FAFC4; --save-soft: #1E2E36;
      --line: #322A1C;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .saved { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .status { font-family: var(--mono); font-size: 11.5px; padding: 8px 12px; border-radius: var(--r); margin-bottom: 14px; display: none; }
  .status.show { display: block; }
  .status--ok { background: var(--in-soft); color: var(--in); }
  .status--err { background: var(--out-soft); color: var(--out); }
  .status--busy { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin: 0 0 9px; padding-left: 2px; }

  /* 요약 */
  .sum { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .sum__c { padding: 15px 10px; text-align: center; }
  .sum__c + .sum__c { border-left: 1px solid var(--line); }
  .sum__v { font-family: var(--mono); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sum__l { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .bar { display: flex; height: 6px; }
  .bar div { height: 100%; }

  /* 항목 */
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .row__n { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row__w { font-size: 11px; color: var(--faint); flex-shrink: 0; }
  .row__a { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .row__x { background: none; border: none; color: var(--faint); font-size: 17px; line-height: 1; padding: 2px 4px; cursor: pointer; flex-shrink: 0; }
  .row__x:hover { color: var(--out); }
  .empty { padding: 18px 14px; font-size: 13px; color: var(--faint); text-align: center; }

  /* 입력 */
  .add { display: grid; grid-template-columns: 1fr 84px auto; gap: 7px; padding: 11px 14px; border-top: 1px solid var(--line); background: var(--sunk); align-items: center; }
  .add--acct { grid-template-columns: 1fr 84px auto; }
  input, select {
    width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 13.5px; min-width: 0;
  }
  input[type=number] { font-family: var(--mono); text-align: right; }
  .add select { grid-column: 1 / -1; }
  .btn {
    padding: 8px 14px; border-radius: 6px; border: none; background: var(--accent); color: var(--surface);
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: default; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .tab.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }

  footer { margin-top: 22px; text-align: center; }
  footer p { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin: 0; line-height: 1.7; }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="brand">우리집 재정</span>
    <span class="saved" id="savedAt"></span>
  </header>

  <div class="status" id="status"></div>

  <div class="card">
    <div class="sum">
      <div class="sum__c"><div class="sum__v" id="sIn" style="color:var(--in)">–</div><div class="sum__l">월 수입</div></div>
      <div class="sum__c"><div class="sum__v" id="sOut" style="color:var(--out)">–</div><div class="sum__l">월 지출</div></div>
      <div class="sum__c"><div class="sum__v" id="sLeft">–</div><div class="sum__l">남는 돈</div></div>
    </div>
    <div class="bar" id="bar"></div>
  </div>

  <h2>수입 · 지출 · 저축</h2>
  <div class="tabs">
    <button class="tab on" data-kind="income">수입</button>
    <button class="tab" data-kind="expense">지출</button>
    <button class="tab" data-kind="saving">저축·투자</button>
  </div>
  <div class="card">
    <div id="list"></div>
    <div class="add">
      <input id="nName" placeholder="항목 이름" autocomplete="off">
      <input id="nAmt" type="number" inputmode="numeric" placeholder="만원">
      <button class="btn" id="addBtn">추가</button>
      <select id="nWho">
        <option value="both">공동</option>
        <option value="me">남편</option>
        <option value="wife">아내</option>
      </select>
    </div>
  </div>

  <h2>통장 잔액</h2>
  <div class="card">
    <div id="accts"></div>
    <div class="add add--acct">
      <input id="aName" placeholder="통장 이름" autocomplete="off">
      <input id="aAmt" type="number" inputmode="numeric" placeholder="만원">
      <button class="btn" id="addAcct">추가</button>
    </div>
  </div>

  <footer>
    <p>금액 단위: 만원 · 수정하려면 지우고 다시 추가</p>
    <p id="build">우리집 재정</p>
  </footer>
</div>

<script>
(function () {
  var API = '/.netlify/functions/data';
  var state = { items: [], accounts: [], updatedAt: null };
  var tab = 'income';
  var KIND = {
    income:  { color: 'var(--in)',   label: '수입' },
    expense: { color: 'var(--out)',  label: '지출' },
    saving:  { color: 'var(--save)', label: '저축·투자' }
  };
  var WHO = { both: '공동', me: '남편', wife: '아내' };

  function $(id) { return document.getElementById(id); }
  function say(text, kind) { var s = $('status'); s.textContent = text; s.className = 'status show status--' + kind; }
  function quiet() { $('status').className = 'status'; }
  function won(n) { return n.toLocaleString('ko-KR'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function sum(kind) {
    return state.items.filter(function (i) { return i.kind === kind; })
                      .reduce(function (a, i) { return a + (+i.amount || 0); }, 0);
  }

  function render() {
    var inc = sum('income'), exp = sum('expense'), sav = sum('saving');
    var left = inc - exp - sav;
    $('sIn').textContent = won(inc);
    $('sOut').textContent = won(exp + sav);
    $('sLeft').textContent = won(left);
    $('sLeft').style.color = left < 0 ? 'var(--out)' : 'var(--ink)';

    var bar = $('bar');
    bar.innerHTML = '';
    var total = Math.max(inc, exp + sav) || 1;
    [[exp, 'var(--out)'], [sav, 'var(--save)'], [Math.max(0, left), 'var(--in)']].forEach(function (p) {
      if (p[0] <= 0) return;
      var d = document.createElement('div');
      d.style.width = (p[0] / total * 100) + '%';
      d.style.background = p[1];
      bar.appendChild(d);
    });

    var list = $('list');
    list.innerHTML = '';
    var rows = state.items.filter(function (i) { return i.kind === tab; });
    if (!rows.length) {
      list.innerHTML = '<div class="empty">아직 ' + KIND[tab].label + ' 항목이 없습니다</div>';
    } else {
      rows.forEach(function (it) {
        var r = document.createElement('div');
        r.className = 'row';
        r.innerHTML =
          '<span class="dot" style="background:' + KIND[it.kind].color + '"></span>' +
          '<span class="row__n"></span><span class="row__w"></span>' +
          '<span class="row__a"></span><button class="row__x" title="삭제">&times;</button>';
        r.querySelector('.row__n').textContent = it.name;
        r.querySelector('.row__w').textContent = WHO[it.who] || '';
        r.querySelector('.row__a').textContent = won(+it.amount || 0);
        r.querySelector('.row__x').addEventListener('click', function () { removeItem(it.id); });
        list.appendChild(r);
      });
    }

    var ac = $('accts');
    ac.innerHTML = '';
    if (!state.accounts.length) {
      ac.innerHTML = '<div class="empty">통장을 추가해 주세요</div>';
    } else {
      state.accounts.forEach(function (a) {
        var r = document.createElement('div');
        r.className = 'row';
        r.innerHTML = '<span class="row__n"></span><span class="row__a"></span><button class="row__x" title="삭제">&times;</button>';
        r.querySelector('.row__n').textContent = a.name;
        r.querySelector('.row__a').textContent = won(+a.balance || 0);
        r.querySelector('.row__x').addEventListener('click', function () { removeAcct(a.id); });
        ac.appendChild(r);
      });
      var tot = state.accounts.reduce(function (s, a) { return s + (+a.balance || 0); }, 0);
      var t = document.createElement('div');
      t.className = 'row';
      t.style.background = 'var(--sunk)';
      t.innerHTML = '<span class="row__n" style="font-weight:600">합계</span><span class="row__a" style="font-weight:700"></span>';
      t.querySelector('.row__a').textContent = won(tot);
      ac.appendChild(t);
    }

    $('savedAt').textContent = state.updatedAt ? '저장 ' + state.updatedAt.slice(0, 10) : '';
  }

  function save(msg) {
    say('저장 중...', 'busy');
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'replace', payload: { items: state.items, accounts: state.accounts } })
    })
      .then(function (r) { if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || '저장 실패'); }); return r.json(); })
      .then(function (d) { state = d; render(); say(msg || '저장됨', 'ok'); setTimeout(quiet, 1200); })
      .catch(function (e) { say(e.message, 'err'); });
  }

  function addItem() {
    var name = $('nName').value.trim();
    var amt = parseFloat($('nAmt').value);
    if (!name || !(amt >= 0)) { say('이름과 금액을 입력해 주세요', 'err'); return; }
    state.items.push({ id: uid(), kind: tab, name: name, amount: amt, who: $('nWho').value });
    $('nName').value = ''; $('nAmt').value = '';
    render(); save();
  }
  function removeItem(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    render(); save('삭제됨');
  }
  function addAcct() {
    var name = $('aName').value.trim();
    var amt = parseFloat($('aAmt').value);
    if (!name || !(amt >= 0)) { say('통장 이름과 잔액을 입력해 주세요', 'err'); return; }
    state.accounts.push({ id: uid(), name: name, balance: amt });
    $('aName').value = ''; $('aAmt').value = '';
    render(); save();
  }
  function removeAcct(id) {
    state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
    render(); save('삭제됨');
  }

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      tab = b.getAttribute('data-kind');
      render();
    });
  });
  $('addBtn').addEventListener('click', addItem);
  $('addAcct').addEventListener('click', addAcct);
  $('nAmt').addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem(); });
  $('aAmt').addEventListener('keydown', function (e) { if (e.key === 'Enter') addAcct(); });

  say('불러오는 중...', 'busy');
  fetch(API)
    .then(function (r) { if (!r.ok) throw new Error('불러오기 실패 (' + r.status + ')'); return r.json(); })
    .then(function (d) { state = d; quiet(); render(); })
    .catch(function (e) { say(e.message, 'err'); render(); });
})();
</script>
</body>
</html>
