<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New Life Check-in</title>
<style>
  :root {
    --bg: #EDEAE2;
    --surface: #F8F6F1;
    --ink: #221F1A;
    --ink-muted: #6E675A;
    --ink-faint: #9C9384;
    --accent: #A8722F;
    --accent-soft: #E8D9BE;
    --good: #4C7A5C;
    --good-soft: #DCE7DE;
    --warn: #B23F30;
    --warn-soft: #F1DCD7;
    --line: #D9D2C4;
    --h-gym: #4C7A5C;
    --h-sleep: #A8722F;
    --h-dishes: #8A5A6D;
    --radius: 6px;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130E; --surface: #1E1A13; --ink: #F1ECE1; --ink-muted: #A79A85;
      --ink-faint: #7A7160; --accent: #D89A4E; --accent-soft: #3B2C18;
      --good: #7EB58F; --good-soft: #22322A; --warn: #E17163; --warn-soft: #3A241F;
      --line: #332B1F;
      --h-gym: #7EB58F; --h-sleep: #D89A4E; --h-dishes: #C08FA0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-display);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .page { max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; }
  .wordmark { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 20px; }

  .status {
    font-family: var(--font-mono); font-size: 11.5px; padding: 8px 12px; border-radius: var(--radius);
    margin-bottom: 16px; display: none;
  }
  .status.show { display: block; }
  .status--ok { background: var(--good-soft); color: var(--good); }
  .status--err { background: var(--warn-soft); color: var(--warn); }
  .status--busy { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }

  .check {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 16px;
    background: none; border: none; border-bottom: 1px solid var(--line); font-family: inherit;
    font-size: 16px; color: var(--ink); text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .check:last-child { border-bottom: none; }
  .check:disabled { opacity: 0.5; }
  .check__box {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--ink-faint);
    display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s;
  }
  .check__box svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.15s; }
  .check.is-done .check__box { border-color: transparent; }
  .check.is-done .check__box svg { opacity: 1; }
  .check.is-done[data-habit="gym"] .check__box { background: var(--h-gym); }
  .check.is-done[data-habit="sleep"] .check__box { background: var(--h-sleep); }
  .check.is-done[data-habit="dishes"] .check__box { background: var(--h-dishes); }
  .check.is-done .check__label { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
  /* 안 함 — 기록 없음(빈 네모)과 반드시 달라 보여야 한다. 둘이 같으면 아무것도 못 읽는다. */
  .check__box { position: relative; }
  .check__box .icon-x { position: absolute; color: var(--ink-faint); }
  .check.is-miss .check__box { border-color: var(--ink-faint); border-style: dashed; background: none; }
  .check.is-miss .check__box .icon-x { opacity: 1; }
  .check.is-miss .check__label { color: var(--ink-faint); }

  .dayclose {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px;
    background: none; border: 1px dashed var(--line); color: var(--ink-muted);
    font-family: inherit; font-size: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .dayclose:disabled { opacity: 0.4; }
  .check__meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }

  .date-nav {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted);
  }
  .date-nav button {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 6px 12px; font-family: inherit; cursor: pointer; color: var(--ink); font-size: 14px;
  }

  section { margin-bottom: 20px; }
  .section__title { font-size: 13px; font-weight: 600; color: var(--ink-muted); margin: 0 0 10px; padding: 0 2px; }

  /* 항목 수는 늘거나 준다. 짝수를 전제하면 홀수일 때 반쪽 칸과 어긋난 테두리가 남는다. */
  .stats { display: grid; grid-template-columns: 1fr 1fr; }
  .stat { padding: 14px; text-align: center; border-bottom: 1px solid var(--line); }
  .stat:nth-child(odd) { border-right: 1px solid var(--line); }
  .stat:last-child:nth-child(odd) { grid-column: 1 / -1; border-right: none; }
  .stat:last-child, .stat:nth-last-child(2):nth-child(odd) { border-bottom: none; }
  .stat__value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat__label { font-size: 12.5px; color: var(--ink); margin-top: 5px; }
  .stat__sub { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }

  .history__row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .history__row + .history__row { border-top: 1px solid var(--line); }
  .history__label { font-size: 12.5px; color: var(--ink-muted); width: 52px; flex-shrink: 0; }
  .history__strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; flex: 1; min-width: 0; }
  .history__cell { aspect-ratio: 1; border-radius: 3px; background: var(--line); }
  .history__cell.is-today { box-shadow: 0 0 0 1.5px var(--accent); }
  .history__cell.is-done[data-h="gym"] { background: var(--h-gym); }
  .history__cell.is-done[data-h="sleep"] { background: var(--h-sleep); }
  .history__cell.is-done[data-h="dishes"] { background: var(--h-dishes); }
  .history__range { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); padding: 0 16px 14px; text-align: right; }

  .calendar__header {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 13px;
  }
  .calendar__header button {
    background: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 4px 12px; cursor: pointer; color: var(--ink); font-family: inherit; font-size: 13px;
  }
  .calendar__weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 8px 0;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); text-align: center;
  }
  .calendar__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 6px 8px 4px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 6px; gap: 3px;
  }
  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.is-today { box-shadow: 0 0 0 1.5px var(--accent); }
  .cal-cell.is-future { opacity: 0.35; }
  .cal-cell.is-clickable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cal-cell.is-selected { background: var(--accent-soft); }
  .cal-cell__num { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
  .cal-cell__dots { display: flex; gap: 2px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
  .cal-dot.on[data-h="gym"] { background: var(--h-gym); }
  .cal-dot.on[data-h="sleep"] { background: var(--h-sleep); }
  .cal-dot.on[data-h="dishes"] { background: var(--h-dishes); }
  .calendar__legend {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 12px 16px 6px;
    font-size: 11.5px; color: var(--ink-muted);
  }
  .calendar__legend-item { display: flex; align-items: center; gap: 6px; }
  .calendar__legend-item:last-of-type:nth-child(odd) { grid-column: 1 / -1; }
  .legend__dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .calendar__legend-note {
    grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
    padding: 2px 0 10px;
  }
  .build {
    margin-top: 22px; text-align: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">
  <div class="wordmark">New Life Check-in</div>

  <div class="date-nav">
    <button id="prevDay">‹</button>
    <span id="currentDate">—</span>
    <button id="nextDay">›</button>
  </div>

  <div class="status" id="statusBar"></div>

  <div class="card" id="checkCard"></div>
  <button class="dayclose" id="dayClose">오늘 마감 — 안 찍은 건 '안 함'으로</button>

  <section>
    <p class="section__title">이번 주 <span id="weekRange" style="font-weight:400;color:var(--ink-faint)"></span></p>
    <div class="card stats" id="statsGrid"></div>
  </section>

  <section>
    <p class="section__title">최근 14일</p>
    <div class="card" id="historyCard">
      <div id="historyRows"></div>
      <div class="history__range" id="historyRange"></div>
    </div>
  </section>

  <section>
    <p class="section__title">달력</p>
    <div class="card">
      <div class="calendar__header">
        <button id="prevMonth">‹</button>
        <span id="calMonthLabel">—</span>
        <button id="nextMonth">›</button>
      </div>
      <div class="calendar__weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calendar__grid" id="calGrid"></div>
      <div class="calendar__legend" id="calLegend"></div>
    </div>
  </section>
  <p class="build">build 2026-08-22 · 3단계 체크 + 하루 마감</p>
</div>

<script>
(function () {
  var HABITS = [
    { key: 'gym',     label: '헬스',          short: '헬스',   meta: '주 2~3회', weekly: 'count', target: '목표 2~3회' },
    { key: 'sleep',   label: '11시 전 잠자리', short: '취침',   meta: '매일',     weekly: 'ratio', target: '11시 취침' },
      { key: 'dishes',  label: '저녁 설거지',    short: '설거지', meta: '매일',     weekly: 'ratio', target: '설거지' }
  ];
  var API = '/.netlify/functions/checkin';
  var viewDate = new Date();
  viewDate.setHours(0, 0, 0, 0);
  var calMonth = new Date(); calMonth.setDate(1); calMonth.setHours(0, 0, 0, 0);
  var cachedLog = {};

  function dstr(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function todayMidnight() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }

  function showStatus(text, kind) {
    var el = document.getElementById('statusBar');
    el.textContent = text;
    el.className = 'status show status--' + kind;
  }
  function hideStatus() { document.getElementById('statusBar').className = 'status'; }
  function setDisabled(disabled) {
    document.querySelectorAll('.check').forEach(function (b) { b.disabled = disabled; });
  }

  // --- build static markup from HABITS ---
  var checkCard = document.getElementById('checkCard');
  HABITS.forEach(function (h) {
    var btn = document.createElement('button');
    btn.className = 'check';
    btn.setAttribute('data-habit', h.key);
    btn.innerHTML =
      '<span class="check__box">'
      + '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '<svg class="icon-x" viewBox="0 0 16 16" fill="none"><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
      + '</span>' +
      '<span class="check__label"></span>' +
      '<span class="check__meta"></span>';
    btn.querySelector('.check__label').textContent = h.label;
    btn.querySelector('.check__meta').textContent = h.meta;
    btn.addEventListener('click', function () { toggleHabit(h.key); });
    checkCard.appendChild(btn);
  });

  var statsGrid = document.getElementById('statsGrid');
  HABITS.forEach(function (h) {
    var cell = document.createElement('div');
    cell.className = 'stat';
    cell.innerHTML = '<div class="stat__value" id="stat-' + h.key + '">–</div>'
      + '<div class="stat__label"></div><div class="stat__sub"></div>';
    cell.querySelector('.stat__label').textContent = h.short;
    statsGrid.appendChild(cell);
  });

  var historyRows = document.getElementById('historyRows');
  HABITS.forEach(function (h) {
    var row = document.createElement('div');
    row.className = 'history__row';
    row.innerHTML = '<span class="history__label"></span><div class="history__strip" id="strip-' + h.key + '"></div>';
    row.querySelector('.history__label').textContent = h.short;
    historyRows.appendChild(row);
  });

  var legend = document.getElementById('calLegend');
  HABITS.forEach(function (h) {
    var item = document.createElement('span');
    item.className = 'calendar__legend-item';
    item.innerHTML = '<span class="legend__dot" style="background: var(--h-' + h.key + ')"></span><span></span>';
    item.querySelector('span:last-child').textContent = h.short;
    legend.appendChild(item);
  });
  var note = document.createElement('span');
  note.className = 'calendar__legend-note';
  note.textContent = '날짜 아래 점 순서: ' + HABITS.map(function (h) { return h.short; }).join(' · ');
  legend.appendChild(note);

  // --- data rendering ---
  function renderChecks(dayData) {
    HABITS.forEach(function (h) {
      var btn = document.querySelector('.check[data-habit="' + h.key + '"]');
      var v = dayData ? dayData[h.key] : undefined;
      btn.classList.toggle('is-done', v === true);
      btn.classList.toggle('is-miss', v === false);
    });
  }

  // Everything renders off cachedLog, so switching dates costs no network round trip.
  function renderAll() {
    document.getElementById('currentDate').textContent = dstr(viewDate);
    renderChecks(cachedLog[dstr(viewDate)] || {});
    renderWeekStats(cachedLog);
    renderHistoryStrip(cachedLog);
    renderCalendar(cachedLog);
  }

  // Writes are serialized: GitHub rejects concurrent commits with a stale sha.
  var writeQueue = Promise.resolve();

  function setLocal(date, habit, value) {
    if (!cachedLog[date]) cachedLog[date] = {};
    if (value === null) delete cachedLog[date][habit];
    else cachedLog[date][habit] = value;
  }

  // 세 상태를 돈다: 기록 없음 → 함 → 안 함 → 기록 없음.
  // 예전에는 함/안함 두 상태였는데 '안 함'과 '기록 없음'이 화면에서 같아 보여서
  // 사실상 안 함을 남길 수단이 없었다 (2026-08-22).
  function nextState(v) { return v === undefined ? true : (v === true ? false : null); }

  function toggleHabit(habit) {
    var date = dstr(viewDate);
    var prev = cachedLog[date] ? cachedLog[date][habit] : undefined;
    var next = nextState(prev);

    // Flip the UI first; the network write happens behind it.
    setLocal(date, habit, next);
    renderAll();
    showStatus('저장 중...', 'busy');

    writeQueue = writeQueue.then(function () {
      return fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: date, habit: habit, value: next })
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || ('저장 실패 ' + res.status)); });
          return res.json();
        })
        .then(function (result) {
          if (result.log) cachedLog = result.log;
          renderAll();
          showStatus('저장됨', 'ok');
          setTimeout(hideStatus, 1000);
        })
        .catch(function (err) {
          setLocal(date, habit, prev === undefined ? null : prev);
          renderAll();
          showStatus('저장 실패 — ' + err.message, 'err');
        });
    });
  }

  // 하루를 닫는다 — 안 찍은 항목을 전부 '안 함'으로 확정한다.
  // 미기록이 쌓이면 지표가 아니라 지표의 재료가 없어진다.
  function closeDay() {
    var date = dstr(viewDate);
    var keys = HABITS.map(function (h) { return h.key; });
    var missing = keys.filter(function (k) {
      return !cachedLog[date] || cachedLog[date][k] === undefined;
    });
    if (!missing.length) { showStatus('이미 다 기록됐다', 'ok'); setTimeout(hideStatus, 1200); return; }

    missing.forEach(function (k) { setLocal(date, k, false); });
    renderAll();
    showStatus('마감 중...', 'busy');

    writeQueue = writeQueue.then(function () {
      return fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: date, close: true, habits: keys })
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || ('마감 실패 ' + res.status)); });
          return res.json();
        })
        .then(function (result) {
          if (result.log) cachedLog = result.log;
          renderAll();
          showStatus(missing.length + '개를 안 함으로 기록했다', 'ok');
          setTimeout(hideStatus, 1500);
        })
        .catch(function (err) {
          missing.forEach(function (k) { setLocal(date, k, null); });
          renderAll();
          showStatus('마감 실패 — ' + err.message, 'err');
        });
    });
  }

  function mondayOf(d) {
    var day = d.getDay();
    var monday = new Date(d);
    monday.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    monday.setHours(0, 0, 0, 0);
    return monday;
  }

  function renderWeekStats(fullData) {
    var today = todayMidnight();
    var days = [];
    var cur = mondayOf(today);
    while (cur <= today) { days.push(dstr(cur)); cur.setDate(cur.getDate() + 1); }
    var range = document.getElementById('weekRange');
    if (range) {
      var mon = mondayOf(today);
      range.textContent = '· ' + (mon.getMonth() + 1) + '/' + mon.getDate()
        + ' ~ 오늘 ' + days.length + '일';
    }
    HABITS.forEach(function (h) {
      var n = days.filter(function (d) { return fullData[d] && fullData[d][h.key]; }).length;
      var cell = document.getElementById('stat-' + h.key);
      // 매일 항목은 분모를 쓰지 않는다 — 경과일을 목표로 오해하게 만든다.
      cell.textContent = h.weekly === 'count' ? n + '회' : n + '일';
      var sub = cell.parentNode.querySelector('.stat__sub');
      if (sub) sub.textContent = h.weekly === 'count'
        ? '목표 ' + h.meta
        : '이번 주 ' + days.length + '일 중';
    });
  }

  function renderHistoryStrip(fullData) {
    var today = todayMidnight();
    var todayStr = dstr(today);
    var dates = [];
    for (var i = 13; i >= 0; i--) { var d = new Date(today); d.setDate(today.getDate() - i); dates.push(d); }
    HABITS.forEach(function (h) {
      var strip = document.getElementById('strip-' + h.key);
      strip.innerHTML = '';
      dates.forEach(function (d) {
        var ds = dstr(d);
        var cell = document.createElement('div');
        cell.className = 'history__cell' + (fullData[ds] && fullData[ds][h.key] ? ' is-done' : '') + (ds === todayStr ? ' is-today' : '');
        cell.setAttribute('data-h', h.key);
        cell.title = ds;
        strip.appendChild(cell);
      });
    });
    document.getElementById('historyRange').textContent = dstr(dates[0]) + ' ~ ' + dstr(dates[13]);
  }

  function renderCalendar(fullData) {
    document.getElementById('calMonthLabel').textContent = calMonth.getFullYear() + '년 ' + (calMonth.getMonth() + 1) + '월';
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    var startWeekday = calMonth.getDay();
    var daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
    var today = todayMidnight();
    var todayStr = dstr(today);
    var selectedStr = dstr(viewDate);

    for (var i = 0; i < startWeekday; i++) {
      var empty = document.createElement('div');
      empty.className = 'cal-cell is-empty';
      grid.appendChild(empty);
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
      var ds = dstr(d);
      var isFuture = d > today;
      var cell = document.createElement('div');
      cell.className = 'cal-cell'
        + (ds === todayStr ? ' is-today' : '')
        + (isFuture ? ' is-future' : ' is-clickable')
        + (ds === selectedStr ? ' is-selected' : '');
      if (!isFuture) {
        cell.addEventListener('click', (function (clicked) {
          return function () { viewDate = clicked; renderAll(); };
        })(new Date(d)));
      }
      var num = document.createElement('div');
      num.className = 'cal-cell__num';
      num.textContent = day;
      var dots = document.createElement('div');
      dots.className = 'cal-cell__dots';
      HABITS.forEach(function (h) {
        var dot = document.createElement('span');
        dot.className = 'cal-dot' + (fullData[ds] && fullData[ds][h.key] ? ' on' : '');
        dot.setAttribute('data-h', h.key);
        dots.appendChild(dot);
      });
      cell.appendChild(num);
      cell.appendChild(dots);
      grid.appendChild(cell);
    }
  }

  // The only read from the network: one full-log fetch at startup.
  function loadAll() {
    showStatus('불러오는 중...', 'busy');
    setDisabled(true);
    fetch(API)
      .then(function (res) { if (!res.ok) throw new Error('불러오기 실패 (' + res.status + ')'); return res.json(); })
      .then(function (fullData) {
        cachedLog = fullData;
        hideStatus();
        setDisabled(false);
        renderAll();
      })
      .catch(function (err) { showStatus(err.message, 'err'); setDisabled(false); });
  }

  document.getElementById('prevDay').addEventListener('click', function () {
    viewDate.setDate(viewDate.getDate() - 1); renderAll();
  });
  document.getElementById('nextDay').addEventListener('click', function () {
    if (viewDate < todayMidnight()) { viewDate.setDate(viewDate.getDate() + 1); renderAll(); }
  });
  document.getElementById('dayClose').addEventListener('click', closeDay);
  document.getElementById('prevMonth').addEventListener('click', function () {
    calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(cachedLog);
  });
  document.getElementById('nextMonth').addEventListener('click', function () {
    calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(cachedLog);
  });

  renderAll();
  loadAll();
})();
</script>
</body>
</html>
